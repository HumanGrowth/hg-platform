<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="margin:0; padding:0; background:#EFE7D7; font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EFE7D7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background:#FFFFFF; border-radius:16px; overflow:hidden;">
          <tr><td style="background:#4A7A54; height:8px; line-height:8px; font-size:8px;">&nbsp;</td></tr>
          <tr>
            <td style="padding:36px 40px; color:#1A1A1A; font-size:17px; line-height:26px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px 32px; border-top:1px solid #EFE7D7;">
              <p style="margin:0; font-size:12px; line-height:18px; color:#9A9384;">HumanGrowth · Costa Rica · <a href="mailto:admin@humangrowth.io?subject=Baja" style="color:#9A9384; text-decoration:underline;">Cancelar suscripción</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
