{% extends "base.html" %}
{% block content %}
<p style="margin:0 0 16px 0;"><strong style="color:#1A1A1A;">Hola{% if name %} {{ name }}{% endif %},</strong></p>
<p style="margin:0 0 6px 0; color:#9A9384; font-size:14px;">Sobre tu solicitud {{ code }}:</p>
<p style="margin:0 0 16px 0; white-space:pre-wrap; color:#1A1A1A;">{{ body }}</p>
{% if app_url %}
<p style="margin:0;">Podés ver y responder desde <a href="{{ app_url }}/soporte" style="color:#4A7A54;">tu cuenta</a>.</p>
{% else %}
<p style="margin:0; color:#9A9384; font-size:14px;">Para responder, escribí a este correo e incluí el código {{ code }}.</p>
{% endif %}
{% endblock %}
