<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ headline }}</title>
</head>
<body style="margin:0;padding:0;background:#1a1816;font-family:Manrope,Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1a1816;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#242120;border:1px solid #3a3633;border-radius:16px;">
          <tr>
            <td style="padding:32px 32px 8px 32px;">
              <p style="margin:0 0 16px 0;font-size:13px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#e8530a;">Resumen semanal</p>
              <p style="margin:0 0 8px 0;font-size:16px;color:#b3b0a8;">Hola {{ nombre }},</p>
              <h1 style="margin:0 0 16px 0;font-size:24px;line-height:1.3;font-weight:800;color:#faf3e8;">{{ headline }}</h1>
              <p style="margin:0 0 16px 0;font-size:16px;line-height:1.6;color:#b3b0a8;">{{ inactive_line }}</p>
              <p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#8e8e8e;">Este resumen solo muestra totales. El detalle por persona depende de lo que cada colaborador autorizó.</p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:12px;background:#4a7a54;">
                    <a href="{{ cta_url }}" style="display:inline-block;padding:14px 24px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">{{ cta_label }}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 32px 32px;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#8e8e8e;">Te llega una vez por semana. Podés apagarlo cuando quieras en <a href="{{ prefs_url }}" style="color:#c8a76e;">tu perfil</a>.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
